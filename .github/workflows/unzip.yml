name: Unzip Project Files
on:
  workflow_dispatch:

jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip and Push files
        run: |
          unzip -o HOMS_AUTO_REPLY.zip
          rm HOMS_AUTO_REPLY.zip
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Extract HOMS_AUTO_REPLY.zip"
          git push
